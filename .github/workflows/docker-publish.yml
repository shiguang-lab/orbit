name: Publish ShiguangGateway Independent image

on:
  push:
    branches: [main]
    tags: ["v*", "v*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example 0.1.0)
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: shiguang-gateway-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/shiguang-lab/shiguang-gateway

jobs:
  verify:
    name: Verify independent runtime
    runs-on: ubuntu-latest
    env:
      # Release validation must not silently depend on a sibling official
      # checkout; the route/HTTP contract hashes are committed in this repo.
      SHIGUANG_GATEWAY_REFERENCE_DIR: /tmp/no-official-orbit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: |
          pnpm typecheck
          pnpm build

      - name: Run independence and runtime smoke gates
        run: |
          pnpm audit:gateway-independence
          pnpm audit:route-contracts
          pnpm audit:brand
          pnpm --filter @shiguang-gateway/http-kernel test
          pnpm smoke:route-imports
          pnpm smoke:split-deployment
          node --test scripts/smoke-worker-start.test.mjs
          pnpm smoke:worker
          pnpm smoke:agent-skills

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: admin
            image: admin
          - target: edge-gateway
            image: edge
          - target: control-api
            image: control
          - target: realtime
            image: realtime
          - target: worker
            image: worker
          - target: importer
            image: importer
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            primary="${INPUT_TAG:-latest}"
          elif [[ "$REF_TYPE" == tag ]]; then
            primary="${REF_NAME#v}"
          else
            primary="latest"
          fi
          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$primary"
            echo "$IMAGE_NAME:sha-${GITHUB_SHA::12}"
            if [[ "$REF_TYPE" == tag ]]; then echo "$IMAGE_NAME:$REF_NAME"; fi
            if [[ "$primary" != latest && "$EVENT_NAME" != workflow_dispatch ]]; then echo "$IMAGE_NAME:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          # NAS deployment target is x86_64; keeping one platform avoids
          # exhausting GitHub-hosted runner disk while building six services.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ShiguangGateway Independent
            org.opencontainers.image.source=https://github.com/shiguang-lab/shiguang-gateway
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=shiguang-gateway-${{ matrix.target }}
          # Export only the final cache chain. mode=max duplicated every large
          # pnpm/Docker layer and exhausted the hosted runner disk.
          cache-to: type=gha,scope=shiguang-gateway-${{ matrix.target }},mode=min

  release:
    name: Build GitHub Release assets
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source and NAS deployment archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/nas-deploy
          git archive --format=tar.gz --prefix="shiguang-gateway-${VERSION}/" HEAD \
            -o "release-assets/shiguang-gateway-${VERSION}.source.tar.gz"
          git archive --format=zip --prefix="shiguang-gateway-${VERSION}/" HEAD \
            -o "release-assets/shiguang-gateway-${VERSION}.source.zip"
          cp docker-compose.yml .env.example deploy/NAS-DEPLOY.md release-assets/nas-deploy/
          mkdir -p release-assets/nas-deploy/deploy/postgres-init
          cp deploy/docker-compose.infrastructure.yml deploy/.env.infrastructure.example release-assets/nas-deploy/deploy/
          cp deploy/postgres-init/*.sql release-assets/nas-deploy/deploy/postgres-init/
          tar -czf "release-assets/shiguang-gateway-${VERSION}-nas-deploy.tar.gz" \
            -C release-assets/nas-deploy .
          (cd release-assets && sha256sum shiguang-gateway-*.source.tar.gz shiguang-gateway-*.source.zip shiguang-gateway-*-nas-deploy.tar.gz > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Shiguang Gateway

            Container images (one per deployable service):

            `ghcr.io/shiguang-lab/shiguang-gateway-admin:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/shiguang-gateway-edge:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/shiguang-gateway-control:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/shiguang-gateway-realtime:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/shiguang-gateway-worker:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/shiguang-gateway-importer:${{ github.ref_name }}`

            NAS deployment downloads the `-nas-deploy.tar.gz` asset, sets all six
            `SHIGUANG_GATEWAY_*_IMAGE` variables and the stable encryption/auth secrets,
            then runs `docker compose pull && docker compose up -d`.
          files: |
            release-assets/shiguang-gateway-${{ github.ref_name }}.source.tar.gz
            release-assets/shiguang-gateway-${{ github.ref_name }}.source.zip
            release-assets/shiguang-gateway-${{ github.ref_name }}-nas-deploy.tar.gz
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
