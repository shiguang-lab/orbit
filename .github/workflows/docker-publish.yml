name: Publish Orbit Gateway image

on:
  push:
    branches: [main]
    tags: ["v*", "v*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example 0.1.0)
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: orbit-gateway-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/shiguang-lab/orbit-gateway

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            primary="${INPUT_TAG:-latest}"
          elif [[ "$REF_TYPE" == tag ]]; then
            primary="${REF_NAME#v}"
          else
            primary="latest"
          fi
          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$primary"
            echo "$IMAGE_NAME:sha-${GITHUB_SHA::12}"
            if [[ "$REF_TYPE" == tag ]]; then echo "$IMAGE_NAME:$REF_NAME"; fi
            if [[ "$primary" != latest && "$EVENT_NAME" != workflow_dispatch ]]; then echo "$IMAGE_NAME:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Orbit Gateway
            org.opencontainers.image.source=https://github.com/shiguang-lab/orbit-gateway
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=orbit-gateway
          cache-to: type=gha,scope=orbit-gateway,mode=max
