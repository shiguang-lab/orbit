name: Publish Orbit Gateway image

on:
  push:
    branches: [main]
    tags: ["v*", "v*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example 0.1.0)
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: orbit-gateway-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/shiguang-lab/orbit-gateway

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            primary="${INPUT_TAG:-latest}"
          elif [[ "$REF_TYPE" == tag ]]; then
            primary="${REF_NAME#v}"
          else
            primary="latest"
          fi
          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$primary"
            echo "$IMAGE_NAME:sha-${GITHUB_SHA::12}"
            if [[ "$REF_TYPE" == tag ]]; then echo "$IMAGE_NAME:$REF_NAME"; fi
            if [[ "$primary" != latest && "$EVENT_NAME" != workflow_dispatch ]]; then echo "$IMAGE_NAME:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Orbit Gateway
            org.opencontainers.image.source=https://github.com/shiguang-lab/orbit-gateway
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=orbit-gateway
          cache-to: type=gha,scope=orbit-gateway,mode=max

  release:
    name: Build GitHub Release assets
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source and NAS deployment archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/nas-deploy
          git archive --format=tar.gz --prefix="orbit-gateway-${VERSION}/" HEAD \
            -o "release-assets/orbit-gateway-${VERSION}.source.tar.gz"
          git archive --format=zip --prefix="orbit-gateway-${VERSION}/" HEAD \
            -o "release-assets/orbit-gateway-${VERSION}.source.zip"
          cp docker-compose.yml .env.example deploy/NAS-DEPLOY.md release-assets/nas-deploy/
          tar -czf "release-assets/orbit-gateway-${VERSION}-nas-deploy.tar.gz" \
            -C release-assets/nas-deploy .
          (cd release-assets && sha256sum orbit-gateway-*.source.tar.gz orbit-gateway-*.source.zip orbit-gateway-*-nas-deploy.tar.gz > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Orbit Gateway

            Container image:

            `ghcr.io/shiguang-lab/orbit-gateway:${{ github.ref_name }}`

            NAS deployment only requires downloading the `-nas-deploy.tar.gz` asset,
            setting `OMNIROUTE_NAS_API_TARGET` and
            `OMNIROUTE_NAS_MANAGEMENT_API_KEY`, then running `docker compose pull`.
          files: |
            release-assets/orbit-gateway-${{ github.ref_name }}.source.tar.gz
            release-assets/orbit-gateway-${{ github.ref_name }}.source.zip
            release-assets/orbit-gateway-${{ github.ref_name }}-nas-deploy.tar.gz
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
