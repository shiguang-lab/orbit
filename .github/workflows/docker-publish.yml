name: Publish Orbit images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: orbit-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify independent runtime
    runs-on: ubuntu-latest
    env:
      # Release validation must not silently depend on a sibling official
      # checkout; the route/HTTP contract hashes are committed in this repo.
      ORBIT_REFERENCE_DIR: /tmp/no-official-orbit
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/cliproxy-manager/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: |
          pnpm typecheck
          pnpm build

      - name: Run independence and runtime smoke gates
        run: pnpm verify:release

  publish-console:
    name: Publish console
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      target: console

  publish-gateway:
    name: Publish gateway
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      target: gateway

  publish-control:
    name: Publish control
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      target: control

  publish-realtime:
    name: Publish realtime
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      target: realtime

  publish-worker:
    name: Publish worker
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      target: worker

  publish-cliproxy-manager:
    name: Publish cliproxy-manager
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      target: cliproxy-manager
      context: ./apps/cliproxy-manager

  release:
    name: Build GitHub Release assets
    needs:
      - publish-console
      - publish-gateway
      - publish-control
      - publish-realtime
      - publish-worker
      - publish-cliproxy-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build source and NAS deployment archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/nas-deploy
          git archive --format=tar.gz --prefix="orbit-${VERSION}/" HEAD \
            -o "release-assets/orbit-${VERSION}.source.tar.gz"
          git archive --format=zip --prefix="orbit-${VERSION}/" HEAD \
            -o "release-assets/orbit-${VERSION}.source.zip"
          cp docker-compose.yml .env.example deploy/NAS-DEPLOY.md release-assets/nas-deploy/
          mkdir -p release-assets/nas-deploy/deploy/postgres-init
          cp deploy/docker-compose.infrastructure.yml deploy/.env.infrastructure.example release-assets/nas-deploy/deploy/
          cp deploy/postgres-init/*.sql release-assets/nas-deploy/deploy/postgres-init/
          tar -czf "release-assets/orbit-${VERSION}-nas-deploy.tar.gz" \
            -C release-assets/nas-deploy .
          (cd release-assets && sha256sum orbit-*.source.tar.gz orbit-*.source.zip orbit-*-nas-deploy.tar.gz > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Orbit

            Container images (one per deployable service):

            `ghcr.io/shiguang-lab/orbit-console:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/orbit-gateway:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/orbit-control:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/orbit-realtime:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/orbit-worker:${{ github.ref_name }}`
            `ghcr.io/shiguang-lab/orbit-cliproxy-manager:${{ github.ref_name }}`

            NAS deployment downloads the `-nas-deploy.tar.gz` asset, sets the six application image variables,
            preserves the stable encryption/auth secrets,
            then runs `docker compose pull && docker compose up -d`.
          files: |
            release-assets/orbit-${{ github.ref_name }}.source.tar.gz
            release-assets/orbit-${{ github.ref_name }}.source.zip
            release-assets/orbit-${{ github.ref_name }}-nas-deploy.tar.gz
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
