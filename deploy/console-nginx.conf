map $http_upgrade $gateway_connection {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $gateway_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Let the application own upload-size validation; nginx must not introduce
  # a second, smaller protocol limit.
  client_max_body_size 0;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $gateway_forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $gateway_connection;
  proxy_buffering off;
  proxy_read_timeout 3600s;

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Keep all protocol surfaces on edge, including their API-prefixed routes.
  # These regex locations precede the general management API location.
  location ~ ^/(api/)?(v1|v1beta|a2a)(/|$) {
    proxy_pass http://orbit-gateway:8787;
  }
  location ~ ^/(api/)?\.well-known/agent\.json$ {
    proxy_pass http://orbit-gateway:8787;
  }
  location ~ ^/(authorize|docs/api/search|livez|readyz)$ {
    proxy_pass http://orbit-gateway:8787;
  }
  location ~ ^/api(/|$) {
    proxy_pass http://orbit-control:8788;
  }
  location ~ ^/live-ws(/|$) {
    proxy_pass http://orbit-realtime:20132;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
