services:
  shiguang-gateway-admin:
    image: ${SHIGUANG_GATEWAY_ADMIN_IMAGE:-shiguang-gateway-admin:local}
    build: { context: ., target: admin }
    container_name: shiguang-gateway-admin
    restart: unless-stopped
    ports:
      - "${SHIGUANG_GATEWAY_ADMIN_PORT:-8787}:8080"
    networks: [gateway-infra]
    depends_on:
      shiguang-gateway-control:
        condition: service_healthy
      shiguang-gateway-realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  shiguang-gateway-edge:
    image: ${SHIGUANG_GATEWAY_EDGE_IMAGE:-shiguang-gateway-edge:local}
    build: { context: ., target: edge-gateway }
    container_name: shiguang-gateway-edge
    restart: unless-stopped
    init: true
    environment: &gateway-env
      NODE_ENV: production
      APP_NAME: edge-gateway
      DATA_DIR: /app/data
      SQLITE_FILE: /app/data/storage.sqlite
      JWT_SECRET: ${JWT_SECRET:?Set a stable JWT_SECRET}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set a stable API_KEY_SECRET}
      SHIGUANG_GATEWAY_WORKER_COMMAND_TOKEN: ${SHIGUANG_GATEWAY_WORKER_COMMAND_TOKEN:-}
      SHIGUANG_GATEWAY_INTERNAL_SERVICE_TOKEN: ${SHIGUANG_GATEWAY_INTERNAL_SERVICE_TOKEN:?Set a shared internal service token}
      # Required for decrypting imported provider credentials. Never rotate this
      # value implicitly after migration; use the documented key-rotation flow.
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set a stable STORAGE_ENCRYPTION_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      INTERNAL_BASE_URL: ${INTERNAL_BASE_URL:-http://shiguang-gateway-edge:8787}
      SHIGUANG_GATEWAY_BASE_URL: ${SHIGUANG_GATEWAY_BASE_URL:-http://shiguang-gateway-edge:8787}
      EDGE_GATEWAY_HOST: 0.0.0.0
      EDGE_GATEWAY_PORT: 8787
      SHIGUANG_GATEWAY_ENABLE_LIVE_WS: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHIGUANG_GATEWAY_AUTH_MODE: ${SHIGUANG_GATEWAY_AUTH_MODE:-shiguang}
      SG_IDENTITY_ISSUER: ${SG_IDENTITY_ISSUER:-https://shiguanglab.com}
      SG_IDENTITY_AUDIENCE: ${SG_IDENTITY_AUDIENCE:-shiguang-gateway-api}
      SG_IDENTITY_ENTITLEMENT: ${SG_IDENTITY_ENTITLEMENT:-shiguang-gateway:access}
      SG_IDENTITY_JWKS_URL: ${SG_IDENTITY_JWKS_URL:-https://shiguanglab.com/.well-known/sg-identity-jwks.json}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUOTA_STORE_REDIS_URL: ${QUOTA_STORE_REDIS_URL:-redis://redis:6379}
      QUOTA_STORE_DRIVER: ${QUOTA_STORE_DRIVER:-redis}
    volumes:
      - shiguang-gateway_data:/app/data
      - shiguang-gateway_home:/home/node
    networks: [gateway-infra]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  shiguang-gateway-control:
    image: ${SHIGUANG_GATEWAY_CONTROL_IMAGE:-shiguang-gateway-control:local}
    build: { context: ., target: control-api }
    container_name: shiguang-gateway-control
    restart: unless-stopped
    init: true
    environment:
      <<: *gateway-env
      APP_NAME: control-api
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: 8788
      EDGE_GATEWAY_URL: http://shiguang-gateway-edge:8787
      INTERNAL_BASE_URL: ${INTERNAL_BASE_URL:-http://shiguang-gateway-control:8788}
      SHIGUANG_GATEWAY_WORKER_COMMAND_URL: ${SHIGUANG_GATEWAY_WORKER_COMMAND_URL:-http://shiguang-gateway-worker:8791}
    volumes:
      - shiguang-gateway_data:/app/data
      - shiguang-gateway_home:/home/node
    networks: [gateway-infra]
    depends_on:
      shiguang-gateway-edge:
        condition: service_healthy

  shiguang-gateway-realtime:
    image: ${SHIGUANG_GATEWAY_REALTIME_IMAGE:-shiguang-gateway-realtime:local}
    build: { context: ., target: realtime }
    container_name: shiguang-gateway-realtime
    restart: unless-stopped
    init: true
    environment:
      <<: *gateway-env
      APP_NAME: realtime
      SHIGUANG_GATEWAY_ENABLE_LIVE_WS: "true"
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 8790
      LIVE_WS_HOST: 0.0.0.0
      LIVE_WS_PORT: 20132
    volumes:
      - shiguang-gateway_data:/app/data
      - shiguang-gateway_home:/home/node
    networks: [gateway-infra]
    depends_on:
      shiguang-gateway-edge:
        condition: service_healthy

  shiguang-gateway-worker:
    image: ${SHIGUANG_GATEWAY_WORKER_IMAGE:-shiguang-gateway-worker:local}
    build: { context: ., target: worker }
    container_name: shiguang-gateway-worker
    restart: unless-stopped
    init: true
    environment:
      <<: *gateway-env
      APP_NAME: worker
      WORKER_COMMAND_HOST: 0.0.0.0
      WORKER_COMMAND_PORT: 8791
    volumes:
      - shiguang-gateway_data:/app/data
      - shiguang-gateway_home:/home/node
    networks: [gateway-infra]
    depends_on:
      shiguang-gateway-edge:
        condition: service_healthy

  shiguang-gateway-importer:
    image: ${SHIGUANG_GATEWAY_IMPORTER_IMAGE:-shiguang-gateway-importer:local}
    build: { context: ., target: importer }
    container_name: shiguang-gateway-importer
    profiles: [migration]
    entrypoint: ["node", "apps/importer/dist/main.js"]
    command: ["--source-data-dir", "/source", "--target-data-dir", "/app/data", "--replace", "--source-home-dir", "/source-home", "--target-home-dir", "/home/node"]
    environment:
      NODE_ENV: production
    volumes:
      - shiguang-gateway_data:/app/data
      - shiguang-gateway_home:/home/node
      - ${SHIGUANG_GATEWAY_SOURCE_DATA_DIR:-./source-data}:/source:ro
      - ${SHIGUANG_GATEWAY_SOURCE_HOME_DIR:-./source-home}:/source-home:ro

volumes:
  shiguang-gateway_data:
  shiguang-gateway_home:

networks:
  gateway-infra:
    name: shiguang-gateway-infra
    external: true
