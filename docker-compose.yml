services:
  orbit-console:
    image: ${ORBIT_CONSOLE_IMAGE:-orbit-console:local}
    build: { context: ., target: console }
    container_name: orbit-console
    restart: unless-stopped
    ports:
      - "${ORBIT_CONSOLE_PORT:-8787}:8080"
    networks: [gateway-infra]
    depends_on:
      orbit-control:
        condition: service_healthy
      orbit-realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  orbit-gateway:
    image: ${ORBIT_GATEWAY_IMAGE:-orbit-gateway:local}
    build: { context: ., target: gateway }
    container_name: orbit-gateway
    restart: unless-stopped
    init: true
    environment: &gateway-env
      NODE_ENV: production
      APP_NAME: gateway
      DATA_DIR: /app/data
      SQLITE_FILE: /app/data/storage.sqlite
      JWT_SECRET: ${JWT_SECRET:?Set a stable JWT_SECRET}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set a stable API_KEY_SECRET}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      ORBIT_WORKER_COMMAND_TOKEN: ${ORBIT_WORKER_COMMAND_TOKEN:-}
      ORBIT_INTERNAL_SERVICE_TOKEN: ${ORBIT_INTERNAL_SERVICE_TOKEN:?Set a shared internal service token}
      ORBIT_REALTIME_EVENT_URL: http://orbit-realtime:20132/__orbit_event
      # Required for decrypting imported provider credentials. Never rotate this
      # value implicitly after migration; use the documented key-rotation flow.
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set a stable STORAGE_ENCRYPTION_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      INTERNAL_BASE_URL: ${INTERNAL_BASE_URL:-http://orbit-gateway:8787}
      ORBIT_BASE_URL: ${ORBIT_BASE_URL:-http://orbit-gateway:8787}
      EDGE_GATEWAY_HOST: 0.0.0.0
      EDGE_GATEWAY_PORT: 8787
      ORBIT_ENABLE_LIVE_WS: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLI_QODER_BIN: ${CLI_QODER_BIN:-qodercli}
      SG_AUTH_ORIGIN: ${SG_AUTH_ORIGIN:-https://shiguanglab.com}
      SG_IDENTITY_ISSUER: ${SG_IDENTITY_ISSUER:-https://shiguanglab.com}
      SG_IDENTITY_AUDIENCE: ${SG_IDENTITY_AUDIENCE:-orbit-api}
      SG_IDENTITY_ENTITLEMENT: ${SG_IDENTITY_ENTITLEMENT:-orbit:access}
      SG_IDENTITY_JWKS_URL: ${SG_IDENTITY_JWKS_URL:-https://shiguanglab.com/.well-known/sg-identity-jwks.json}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUOTA_STORE_REDIS_URL: ${QUOTA_STORE_REDIS_URL:-redis://redis:6379}
      QUOTA_STORE_DRIVER: ${QUOTA_STORE_DRIVER:-redis}
    volumes:
      - orbit_data:/app/data
      - orbit_home:/home/node
    networks: [gateway-infra]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  orbit-control:
    image: ${ORBIT_CONTROL_IMAGE:-orbit-control:local}
    build: { context: ., target: control }
    container_name: orbit-control
    restart: unless-stopped
    init: true
    environment:
      <<: *gateway-env
      APP_NAME: control
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: 8788
      ORBIT_CLIPROXY_MANAGER_ENDPOINT: ${ORBIT_CLIPROXY_MANAGER_ENDPOINT:-}
      ORBIT_CLIPROXY_MANAGER_ID: ${ORBIT_CLIPROXY_MANAGER_ID:-nas}
      ORBIT_CLIPROXY_MANAGER_NAME: ${ORBIT_CLIPROXY_MANAGER_NAME:-NAS}
      EDGE_GATEWAY_URL: http://orbit-gateway:8787
      INTERNAL_BASE_URL: ${INTERNAL_BASE_URL:-http://orbit-control:8788}
      ORBIT_WORKER_COMMAND_URL: ${ORBIT_WORKER_COMMAND_URL:-http://orbit-worker:8791}
    volumes:
      - orbit_data:/app/data
      - orbit_home:/home/node
    networks: [gateway-infra]
    depends_on:
      orbit-gateway:
        condition: service_healthy

  orbit-realtime:
    image: ${ORBIT_REALTIME_IMAGE:-orbit-realtime:local}
    build: { context: ., target: realtime }
    container_name: orbit-realtime
    restart: unless-stopped
    init: true
    environment:
      <<: *gateway-env
      APP_NAME: realtime
      ORBIT_ENABLE_LIVE_WS: "true"
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 8790
      LIVE_WS_HOST: 0.0.0.0
      LIVE_WS_PORT: 20132
    volumes:
      - orbit_data:/app/data
      - orbit_home:/home/node
    networks: [gateway-infra]
    depends_on:
      orbit-gateway:
        condition: service_healthy

  orbit-worker:
    image: ${ORBIT_WORKER_IMAGE:-orbit-worker:local}
    build: { context: ., target: worker }
    container_name: orbit-worker
    restart: unless-stopped
    init: true
    environment:
      <<: *gateway-env
      APP_NAME: worker
      WORKER_COMMAND_HOST: 0.0.0.0
      WORKER_COMMAND_PORT: 8791
    volumes:
      - orbit_data:/app/data
      - orbit_home:/home/node
    networks: [gateway-infra]
    depends_on:
      orbit-gateway:
        condition: service_healthy

  orbit-cliproxy-manager:
    image: ${ORBIT_CLIPROXY_MANAGER_IMAGE:-orbit-cliproxy-manager:local}
    build: { context: ./apps/cliproxy-manager }
    profiles: [node]
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    environment:
      CLIPROXY_MANAGER_ID: ${ORBIT_CLIPROXY_MANAGER_ID:-nas}
      CLIPROXY_MANAGER_NAME: ${ORBIT_CLIPROXY_MANAGER_NAME:-NAS}
      CLIPROXY_MANAGER_REPORT_URL: http://orbit-control:8788/internal/service-nodes/${ORBIT_CLIPROXY_MANAGER_ID:-nas}/report
      CLIPROXY_MANAGER_DATA_DIR: /data
      CLIPROXY_MANAGER_LISTEN: 0.0.0.0:8792
    volumes:
      - orbit_node_data:/data
    networks: [gateway-infra]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  orbit-importer:
    image: ${ORBIT_IMPORTER_IMAGE:-orbit-importer:local}
    build: { context: ., target: importer }
    container_name: orbit-importer
    profiles: [migration]
    entrypoint: ["node", "apps/importer/dist/main.js"]
    command: ["--source-data-dir", "/source", "--target-data-dir", "/app/data", "--replace", "--source-home-dir", "/source-home", "--target-home-dir", "/home/node"]
    environment:
      NODE_ENV: production
    volumes:
      - orbit_data:/app/data
      - orbit_home:/home/node
      - ${ORBIT_SOURCE_DATA_DIR:-./source-data}:/source:ro
      - ${ORBIT_SOURCE_HOME_DIR:-./source-home}:/source-home:ro

volumes:
  orbit_node_data:
    name: orbit-node-data
  orbit_data:
    name: orbit-data
  orbit_home:
    name: orbit-home

networks:
  gateway-infra:
    name: orbit-infra
    external: true
